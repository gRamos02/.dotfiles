#Prefix key
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

#Split panes
#bind '\' split-window -h #Horizontal
#bind | split-window -v #Vertical
bind | split-window -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

#Mouse control
set -g mouse on

#Switch panes usint alt-vimkeys without prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

#switch panes next
bind -n -r C-n next-window 

#Dont rename windows
set-option -g allow-rename off

#Reload config file
bind r source-file ~/.tmux.conf

#Prefix hint
set -g status-right ' #{?client_prefix,#[reverse]<prefix>#[noreverse] ,}gera %H:%M %d-%b-%y'

#bar color
set -g status-style bg='#3c3836',fg='#ebdbb2'
set-window-option -g window-status-current-style bg='#ebdbb2',fg='#3c3836'

#idk, config i wrote just for lazynvim
set-option -sa terminal-features ',screen-256color:RGB'
set-option -sg escape-time 10
set-option -g focus-events on
set-option -g default-terminal "screen-256color"

#clipboard options, requires xclip
bind C-c run "tmux save-buffer - | xclip -i -sel clipboard"
# move x clipboard into tmux paste buffer
bind C-p run "tmux set-buffer \"$(xclip -o)\"; tmux paste-buffer"
# move tmux copy buffer into x clipboard
bind C-y run "tmux save-buffer - | xclip -i"

#others
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key -r M-h run-shell "tmux neww tmux-sessionizer -s 0"
bind-key -r M-t run-shell "tmux neww tmux-sessionizer -s 1"
bind-key -r M-n run-shell "tmux neww tmux-sessionizer -s 2"
bind-key -r M-s run-shell "tmux neww tmux-sessionizer -s 3"
